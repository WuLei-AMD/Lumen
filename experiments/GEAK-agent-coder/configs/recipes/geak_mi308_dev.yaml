recipe:
  name: geak_mi308_dev

model:
  name_or_path: Qwen/Qwen3-Coder-30B-A3B-Instruct

precision:
  mode: fp8_blockwise2d
  scaling: blockwise2d
  block_size: 128
  fp8_format: e4m3fnuz
  lumen_format: fp8_e4m3
  adapter_dtype: bfloat16

distributed:
  ep_size: 8
  expert_backend: sonic
  sharding: shard_grad_op

lora:
  attention_rank: 32
  attention_alpha: 64
  expert_rank: 16
  expert_alpha: 32

training:
  learning_rate: 0.0001
  max_grad_norm: 1.0
  micro_batch_size: 1
  log_interval: 1
  seed: 1234
